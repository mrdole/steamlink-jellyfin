name: check
# scripts/check.sh: versions agree, changelog, daemon compiles + tests on the host, scripts parse.
# The ARM build needs Valve's 4.7 GB SDK and is not run here; build locally (scripts/build.sh) before merging.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - run: scripts/check.sh
  changelog:
    # every PR adds a line under [Unreleased] (or bumps the version); label "skip-changelog" to opt out
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md || { echo "::error::add a line to CHANGELOG.md under [Unreleased] (or label skip-changelog)"; exit 1; }
